# DealLock — example production docker-compose.
# Copy, fill in your secrets and domains, then use with:
#   docker compose -f docker-compose.production.example.yml up -d
#
# WARNING: this file is an EXAMPLE. Never commit your real production secrets to git.
# Use a secrets manager or environment injection in your deployment platform instead.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deallock
      POSTGRES_USER: deallock
      POSTGRES_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deallock"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://deallock:REPLACE_WITH_STRONG_PASSWORD@postgres:5432/deallock?schema=public
      SESSION_SECRET: REPLACE_WITH_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
      SESSION_STORE: postgres
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: lax
      TRUST_PROXY: "true"
      FRONTEND_ORIGIN: https://YOUR_FRONTEND_DOMAIN
      APP_URL: https://YOUR_FRONTEND_DOMAIN
      PORT: "4000"
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: "DealLock <no-reply@YOUR_DOMAIN>"
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "587"
      SMTP_USER: resend
      SMTP_PASS: re_YOUR_RESEND_API_KEY
      SMTP_SECURE: "false"
      SEPOLIA_RPC_URL: https://eth-sepolia.g.alchemy.com/v2/YOUR_ALCHEMY_KEY
      INDEXER_ENABLED: "true"
      FACTORY_INDEXER_ENABLED: "true"
      FACTORY_CONTRACTS: 11155111:YOUR_FACTORY_ADDRESS
    ports:
      - "4000:4000"
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

  # Optional: run the indexer as a separate worker process.
  # Recommended for high-load deployments to avoid blocking the API server.
  # The indexer uses a PostgreSQL advisory lock, so running both backend and
  # indexer-worker simultaneously is safe — only one will index at a time.
  # indexer-worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     <<: *backend-env   # same env as backend
  #     INDEXER_ENABLED: "true"
  #   command: node dist/indexerCli.js

volumes:
  postgres_data:
